<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Currency Exchange</title>

<script src="https://js.stripe.com/v3/"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f4f4f7;
  --card:#ffffff;
  --text:#111;
  --muted:#666;
  --border:rgba(0,0,0,0.08);
  --shadow:0 10px 25px rgba(0,0,0,0.06);
  --radius:16px;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}

/* RESET */
*{box-sizing:border-box;}
body{
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:calc(16px + var(--safe-top)) 16px calc(90px + var(--safe-bottom));
}

/* APP CONTAINER */
.container{
  max-width:900px;
  margin:auto;
}

/* HEADER */
h1{
  font-size:22px;
  text-align:center;
  margin:10px 0 20px;
  font-weight:600;
  letter-spacing:0.3px;
}

/* TABS (iOS/Android style) */
.nav-links{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-around;
  background:rgba(244,244,247,0.8);
  backdrop-filter: blur(10px);
  padding:10px;
  border-radius:12px;
  margin-bottom:15px;
}

.nav-link{
  text-decoration:none;
  color:var(--muted);
  font-weight:500;
  font-size:14px;
  padding:8px 14px;
  border-radius:999px;
}

.nav-link.active{
  background:#000;
  color:#fff;
}

/* CARDS */
.panel{
  background:var(--card);
  border-radius:var(--radius);
  padding:16px;
  margin:12px 0;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

.panel strong{
  display:block;
  margin-bottom:10px;
  font-size:13px;
  color:var(--muted);
  letter-spacing:0.5px;
}

/* TEXT */
.blurb{
  font-size:14px;
  color:var(--muted);
  line-height:1.5;
}

/* CHART */
#valueChart{
  width:100%!important;
  height:220px!important;
}

/* TABLE (mobile friendly) */
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th,td{
  padding:12px 8px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

th{
  color:var(--muted);
  font-weight:600;
}

/* BUTTONS */
button{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  background:#000;
  color:#fff;
  font-weight:600;
  margin-top:10px;
  cursor:pointer;
}

button:active{
  transform:scale(0.98);
}

.secondary{
  background:#fff;
  color:#000;
  border:1px solid var(--border);
}

/* VIEWS */
.view{display:none;}
.view.active{display:block;}

/* FOOTER */
.footer{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:30px;
}

/* BOTTOM NAV (mobile native feel) */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,0.9);
  backdrop-filter: blur(20px);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  padding:10px 0 calc(10px + var(--safe-bottom));
}

.bottom-nav a{
  font-size:12px;
  text-decoration:none;
  color:var(--muted);
  text-align:center;
  flex:1;
}

.bottom-nav a.active{
  color:#000;
  font-weight:600;
}
</style>
</head>

<body>

<div class="container">

<!-- TOP NAV -->
<div class="nav-links">
  <a href="#" class="nav-link active" onclick="switchView('market', this)">Market</a>
  <a href="#" class="nav-link" onclick="switchView('transactions', this)">Activity</a>
</div>

<!-- MARKET -->
<div id="marketView" class="view active">

<h1>Currency Exchange</h1>

<div class="panel">
  <strong>GLOBAL DOLLAR</strong>
  <div id="liveGlobal" style="font-size:24px;font-weight:600;">$100.00</div>
</div>

<div class="panel">
  <strong>VALUE TREND</strong>
  <canvas id="valueChart"></canvas>
</div>

<div class="panel">
  <strong>AI SYSTEM</strong>
  <p class="blurb">
    Adaptive liquidity engine analyzing global markets in real-time.
  </p>
</div>

<table>
<thead>
<tr><th>ASSET</th><th>VALUE</th><th>CHANGE</th><th>%</th></tr>
</thead>
<tbody id="tradeTable"></tbody>
</table>

<div class="panel">
  <strong>BALANCE</strong>
  <div id="allocatedAmount">$0</div>
</div>

<div class="panel">
  <strong>EARNINGS</strong>
  <div id="totalEarned">$0</div>
</div>

</div>

<!-- TRANSACTIONS -->
<div id="transactionsView" class="view">
<h1>Activity</h1>

<div class="panel">
<table>
<thead>
<tr><th>TYPE</th><th>AMOUNT</th><th>STATUS</th><th>TIME</th></tr>
</thead>
<tbody id="txTable"></tbody>
</table>
</div>

</div>

<!-- BANK -->
<div class="panel">
<strong>Wallet</strong>
<button>Deposit</button>
<button class="secondary">Send</button>
<button>Apple Pay</button>
</div>

<div class="footer">
© <span id="year"></span> Clean, Inc.
</div>

</div>

<!-- BOTTOM NAV (native app feel) -->
<div class="bottom-nav">
  <a href="#" class="active">Market</a>
  <a href="#">Wallet</a>
  <a href="#">Activity</a>
  <a href="#">Settings</a>
</div>

<script>
const assets=["EURUSD","USDJPY","GBPUSD"];
document.getElementById("year").innerText=new Date().getFullYear();

/* TABLE */
assets.forEach(a=>{
  const row=document.createElement("tr");
  row.innerHTML=`<td>${a}</td><td id="${a}">--</td><td>-</td><td>-</td>`;
  tradeTable.appendChild(row);
});

/* CHART */
const ctx=document.getElementById("valueChart").getContext("2d");
let chartData=[];
let chartLabels=[];

const valueChart=new Chart(ctx,{
  type:"line",
  data:{
    labels:chartLabels,
    datasets:[{
      data:chartData,
      borderColor:"#000",
      tension:0.2,
      borderWidth:2,
      pointRadius:0
    }]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{
      x:{display:false},
      y:{display:false}
    }
  }
});

/* LIVE */
let globalValue=100;

setInterval(()=>{
  assets.forEach(a=>{
    document.getElementById(a).innerText=(Math.random()*2).toFixed(4);
  });

  globalValue+=(Math.random()-0.5)*1.5;
  if(globalValue<0)globalValue=0;

  liveGlobal.innerText="$"+globalValue.toFixed(2);

  chartLabels.push("");
  chartData.push(globalValue);

  if(chartData.length>40){
    chartData.shift();
    chartLabels.shift();
  }

  valueChart.update();
},1000);

/* VIEW SWITCH */
function switchView(view,el){
  event.preventDefault();
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.querySelectorAll(".nav-link").forEach(l=>l.classList.remove("active"));

  if(view==="market")marketView.classList.add("active");
  if(view==="transactions")transactionsView.classList.add("active");

  el.classList.add("active");
}
</script>

</body>
</html>
