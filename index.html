<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Currency Exchange</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#d4d4d4;
  --text:#000;
}
*{box-sizing:border-box;}
body{margin:0;padding:40px;background:var(--bg);color:var(--text);font-family:"JetBrains Mono",monospace;}
.container{max-width:1000px;margin:auto;}
h1{font-size:28px;letter-spacing:2px;border-bottom:1px solid black;padding-bottom:10px;margin-bottom:30px;text-align:center;}

.nav-links{display:flex;justify-content:center;gap:20px;margin-bottom:30px;flex-wrap:wrap;font-size:14px;}
.nav-link{text-decoration:none;color:black;padding-bottom:4px;border-bottom:1px solid transparent;opacity:0.6;}
.nav-link:hover{border-bottom:1px solid black;opacity:1;}
.nav-link.active{border-bottom:1px solid black;font-weight:bold;opacity:1;}

.panel{margin-top:30px;border:1px solid black;padding:25px;text-align:center;}
.panel strong{display:block;margin-bottom:12px;}
.blurb{font-size:14px;line-height:1.6;max-width:700px;margin:auto;}

#trendChart{
  width:100% !important;
  max-height:260px;
  margin-top:20px;
}

input, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:1px solid black;
  text-align:center;
  font-family:"JetBrains Mono", monospace;
  font-size:14px;
  background:black;
  color:white;
}

.modal select {
  appearance: none;
  background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
  background-repeat: no-repeat;
  background-position: right 12px center;
  padding-right: 30px;
  cursor:pointer;
}

button{
  width:100%;
  margin-top:12px;
  padding:12px;
  background:black;
  color:white;
  border:1px solid black;
  cursor:pointer;
}
button:hover{background:white;color:black;}
.apple-pay-btn{margin-top:10px;padding:14px;}

table{width:100%;margin-top:30px;border-collapse:collapse;}
th,td{padding:14px;border-bottom:1px solid black;text-align:center;font-size:14px;}

.view{display:none;}
.view.active{display:block;}

.footer{margin-top:50px;padding-top:20px;border-top:1px solid black;display:flex;justify-content:center;gap:10px;font-size:12px;}
.footer a{color:black;text-decoration:none;}
.footer a:hover{text-decoration:underline;}

.modal{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:1000;
}
.modal-content{
  background:#d4d4d4;
  padding:30px;
  border:1px solid black;
  max-width:400px;
  width:100%;
  text-align:center;
}
.secondary{background:white;color:black;}
.secondary:hover{background:black;color:white;}
</style>
</head>

<body>
<div class="container">

<div class="nav-links">
  <a href="#" class="nav-link active" onclick="switchView('market', this)">MARKET</a>
  <a href="#" class="nav-link" onclick="switchView('transactions', this)">TRANSACTIONS</a>
</div>

<!-- MARKET -->
<div id="marketView" class="view active">
<h1>CURRENCY EXCHANGE</h1>

<div class="panel">
<strong>GLOBAL DOLLAR</strong>
<p id="liveGlobal">$0</p>

<!-- ✅ TREND GRAPH ADDED -->
<canvas id="trendChart"></canvas>
</div>

<div class="panel">
<strong>AI MARKET SYSTEM</strong>
<p class="blurb">
Currency Exchange monitors global markets in real time and executes trades automatically.
</p>
</div>

<table>
<thead>
<tr><th>ASSET</th><th>VALUE</th><th>CHANGE</th><th>NET %</th></tr>
</thead>
<tbody id="tradeTable"></tbody>
</table>

<div class="panel"><strong>BALANCE</strong><p id="allocatedAmount">$0</p></div>
<div class="panel"><strong>TOTAL EARNED</strong><p id="totalEarned">$0</p></div>
</div>

<!-- TRANSACTIONS -->
<div id="transactionsView" class="view">
<h1>TRANSACTIONS</h1>
<table>
<thead>
<tr><th>TYPE</th><th>AMOUNT</th><th>STATUS</th><th>TIME</th></tr>
</thead>
<tbody id="txTable"></tbody>
</table>
</div>

<!-- BANK PANEL -->
<div class="panel">
<strong>BANK</strong>
<button onclick="openDepositModal()">Deposit</button>
<button onclick="openWithdrawModal()">Send</button>
<button id="applePayBtn" class="apple-pay-btn">Pay</button>
</div>

<!-- MODALS (unchanged) -->
<div id="depositModal" class="modal">
  <div class="modal-content">
    <h2>Deposit</h2>
    <select id="currencySelect">
      <option value="USD">USD – US Dollar</option>
      <option value="EUR">EUR – Euro</option>
      <option value="GBP">GBP – British Pound</option>
      <option value="JPY">JPY – Japanese Yen</option>
      <option value="AUD">AUD – Australian Dollar</option>
      <option value="CAD">CAD – Canadian Dollar</option>
      <option value="CHF">CHF – Swiss Franc</option>
    </select>
    <input type="number" id="fundInput" placeholder="Amount"/>
    <button onclick="depositFunds()">Submit</button>
    <button class="secondary" onclick="closeDepositModal()">Cancel</button>
  </div>
</div>

<div id="withdrawModal" class="modal">
  <div class="modal-content">
    <h2>Send</h2>
    <select id="sendMethod" onchange="updateSendFields()">
      <option value="bank">Bank Transfer</option>
      <option value="zelle">Zelle</option>
    </select>

    <div id="bankFields">
      <input id="routingNumber" placeholder="Routing Number"/>
      <input id="accountNumber" placeholder="Account Number"/>
    </div>

    <div id="zelleFields" style="display:none;">
      <input id="zelleEmail" placeholder="Zelle Email or Phone"/>
    </div>

    <input id="withdrawAmount" type="number" placeholder="Amount"/>
    <button onclick="sendToBank()">Submit Transfer</button>
    <button class="secondary" onclick="closeWithdrawModal()">Cancel</button>
  </div>
</div>

<div class="footer">
<span>© <span id="year"></span> Clean, Inc.</span>
</div>

</div>

<script>
const API="http://localhost:4000/api";
const stripe=Stripe("pk_test_YOUR_PUBLIC_KEY");

let assets=["EURUSD","USDJPY","GBPUSD"];

let chart;
let chartPoints = [];

document.getElementById("year").innerText=new Date().getFullYear();

/* INIT TABLE */
assets.forEach(a=>{
  const row=document.createElement("tr");
  row.innerHTML=`<td>${a}</td><td id="${a}">--</td><td id="c${a}">-</td><td id="n${a}">-</td>`;
  tradeTable.appendChild(row);
});

/* INIT CHART */
function initChart(){
  const ctx=document.getElementById("trendChart");

  chart=new Chart(ctx,{
    type:"line",
    data:{
      labels:[],
      datasets:[{
        label:"Global Value",
        data:[]
      }]
    },
    options:{
      responsive:true,
      animation:false,
      scales:{
        x:{display:false}
      }
    }
  });
}

/* CHART INIT (MATCHED DESIGN) */
function initChart(){
  const ctx=document.getElementById("trendChart");

  chart=new Chart(ctx,{
    type:"line",
    data:{
      labels:[],
      datasets:[{
        data:[],
        borderColor:"#000",
        backgroundColor:"rgba(0,0,0,0.05)",
        borderWidth:1,
        pointRadius:0,
        tension:0,
        fill:true
      }]
    },
    options:{
      responsive:true,
      animation:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:"#000",
          titleColor:"#fff",
          bodyColor:"#fff",
          borderColor:"#000",
          borderWidth:1
        }
      },
      scales:{
        x:{display:false,grid:{display:false}},
        y:{
          ticks:{
            color:"#000",
            font:{family:"JetBrains Mono",size:10}
          },
          grid:{
            color:"rgba(0,0,0,0.1)"
          },
          border:{color:"#000"}
        }
      }
    }
  });
}

/* MARKET LOOP */
setInterval(()=>{
  let sum=0;

  assets.forEach(a=>{
    const val=Math.random()*2;
    document.getElementById(a).innerText=val.toFixed(4);
    sum+=val;
  });

  const globalValue=(sum/assets.length)*100;

  document.getElementById("liveGlobal").innerText="$"+globalValue.toFixed(2);

  // update chart
  const t=Date.now();

  chartPoints.push(globalValue);
  if(chartPoints.length>30) chartPoints.shift();

  chart.data.labels=chartPoints.map((_,i)=>i);
  chart.data.datasets[0].data=chartPoints;
  chart.update();

},1000);

/* VIEW SWITCH */
function switchView(view,el){
  event.preventDefault();
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.querySelectorAll(".nav-link").forEach(l=>l.classList.remove("active"));
  if(view==="market")marketView.classList.add("active");
  if(view==="transactions"){transactionsView.classList.add("active");loadTransactions();}
  el.classList.add("active");
}

/* MODALS */
function openDepositModal(){depositModal.style.display="flex";}
function closeDepositModal(){depositModal.style.display="none";}
function openWithdrawModal(){withdrawModal.style.display="flex";}
function closeWithdrawModal(){withdrawModal.style.display="none";}

/* INIT */
document.addEventListener("DOMContentLoaded",()=>{
  initChart();
  setupApplePay();
});
</script>
</body>
</html>
