<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Currency Exchange</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{--bg:#d4d4d4;--text:#000;}
*{box-sizing:border-box;}
body{
  margin:0;
  padding:40px;
  background:var(--bg);
  color:var(--text);
  font-family:"JetBrains Mono",monospace;
}
.container{max-width:1000px;margin:auto;}
h1{text-align:center;border-bottom:1px solid black;padding-bottom:10px;}

.nav-links{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.nav-link{color:black;text-decoration:none;opacity:0.6;}
.nav-link.active{opacity:1;border-bottom:1px solid black;}

.panel{margin-top:20px;border:1px solid black;padding:20px;text-align:center;}

table{width:100%;margin-top:20px;border-collapse:collapse;}
td,th{padding:10px;border-bottom:1px solid black;text-align:center;}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:1px solid black;
  background:black;
  color:white;
  cursor:pointer;
}
button:hover{background:white;color:black;}

.view{display:none;}
.view.active{display:block;}

canvas{margin-top:20px;}

#pagination{
  margin-top:15px;
  text-align:center;
}
#pagination button{
  width:auto;
  padding:8px 12px;
}
</style>
</head>

<body>

<div class="container">

<div class="nav-links">
<a href="#" class="nav-link active" onclick="switchView('market',this)">MARKET</a>
<a href="#" class="nav-link" onclick="switchView('transactions',this)">TRANSACTIONS</a>
</div>

<!-- MARKET -->
<div id="marketView" class="view active">

<h1>CURRENCY EXCHANGE</h1>

<div class="panel">
<strong>GLOBAL DOLLAR</strong>
<p id="liveGlobal">$0</p>
<canvas id="trendChart"></canvas>
</div>

<table>
<thead>
<tr>
<th>PAIR</th>
<th>VALUE</th>
<th>CHANGE</th>
<th>%</th>
</tr>
</thead>
<tbody id="tradeTable"></tbody>
</table>

<div id="pagination">
<button onclick="prevPage()">Prev</button>
<span id="pageInfo">Page 1</span>
<button onclick="nextPage()">Next</button>
</div>

</div>

<!-- TRANSACTIONS -->
<div id="transactionsView" class="view">
<h1>TRANSACTIONS</h1>
<table>
<thead>
<tr><th>TYPE</th><th>AMOUNT</th><th>STATUS</th><th>TIME</th></tr>
</thead>
<tbody></tbody>
</table>
</div>

<!-- BANK -->
<div class="panel">
<strong>BANK</strong>
<button onclick="openDepositModal()">Deposit</button>
<button id="applePayBtn">Apple Pay</button>
</div>

<!-- MODAL -->
<div id="depositModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;">
<div style="background:#d4d4d4;padding:20px;border:1px solid black;width:300px;">
<h3>Deposit</h3>
<input id="fundInput" placeholder="Amount" style="width:100%;padding:10px;margin-top:10px;"/>
<button onclick="closeDepositModal()">Close</button>
</div>
</div>

</div>

<script>

const stripe = Stripe("pk_test_YOUR_PUBLIC_KEY");

/* =========================
   CURRENCIES + PAIRS
========================= */
const currencies=["USD","EUR","GBP","JPY","AUD","CAD","CHF","NZD"];

let assets=[];
currencies.forEach(a=>{
  currencies.forEach(b=>{
    if(a!==b) assets.push(a+b);
  });
});

/* =========================
   PAGINATION
========================= */
let currentPage = 1;
const rowsPerPage = 12;

const tradeTable = document.getElementById("tradeTable");

function renderTable(){
  tradeTable.innerHTML="";

  const start=(currentPage-1)*rowsPerPage;
  const pageItems=assets.slice(start,start+rowsPerPage);

  pageItems.forEach(pair=>{
    const row=document.createElement("tr");

    row.innerHTML=`
      <td>${pair}</td>
      <td id="${pair}">--</td>
      <td id="c${pair}">-</td>
      <td id="n${pair}">-</td>
    `;

    tradeTable.appendChild(row);
  });

  updatePageInfo();
}

function nextPage(){
  if(currentPage*rowsPerPage < assets.length){
    currentPage++;
    renderTable();
  }
}

function prevPage(){
  if(currentPage>1){
    currentPage--;
    renderTable();
  }
}

function updatePageInfo(){
  document.getElementById("pageInfo").innerText =
    `Page ${currentPage} / ${Math.ceil(assets.length/rowsPerPage)}`;
}

/* =========================
   CHART
========================= */
let chart;
let chartPoints=[];

function initChart(){
  chart=new Chart(document.getElementById("trendChart"),{
    type:"line",
    data:{labels:[],datasets:[{data:[],borderColor:"#000",pointRadius:0}]},
    options:{responsive:true,animation:false,plugins:{legend:{display:false}},scales:{x:{display:false}}}
  });
}

/* =========================
   MARKET ENGINE
========================= */
let lastPrices={};

setInterval(()=>{

  let sum=0;

  assets.forEach(pair=>{

    let prev=lastPrices[pair]||(Math.random()*1.5+0.5);
    let change=(Math.random()-0.5)*0.01;
    let price=prev+change;

    lastPrices[pair]=price;

    const pct=(change/prev)*100;

    const p=document.getElementById(pair);
    const c=document.getElementById("c"+pair);
    const n=document.getElementById("n"+pair);

    if(p){
      p.innerText=price.toFixed(4);
      c.innerText=change.toFixed(4);
      n.innerText=pct.toFixed(2)+"%";

      const color=change>=0?"green":"red";
      c.style.color=color;
      n.style.color=color;
    }

    sum+=price;
  });

  const global=(sum/assets.length)*100;

  liveGlobal.innerText="$"+global.toFixed(2);

  chartPoints.push(global);
  if(chartPoints.length>30) chartPoints.shift();

  chart.data.labels=chartPoints.map((_,i)=>i);
  chart.data.datasets[0].data=chartPoints;
  chart.update();

},1000);

/* =========================
   APPLE PAY (Stripe)
========================= */
function setupApplePay(){

  const paymentRequest=stripe.paymentRequest({
    country:"US",
    currency:"usd",
    total:{label:"Deposit",amount:1000}
  });

  const elements=stripe.elements();
  const prButton=elements.create("paymentRequestButton",{paymentRequest});

  paymentRequest.canMakePayment().then(result=>{
    if(result){
      prButton.mount("#applePayBtn");
    }else{
      document.getElementById("applePayBtn").style.display="none";
    }
  });

  paymentRequest.on("paymentmethod",async(ev)=>{

    const res=await fetch("http://localhost:4000/api/stripe/apple-pay",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({payment_method:ev.paymentMethod.id})
    });

    const data=await res.json();

    await stripe.confirmCardPayment(data.clientSecret,{
      payment_method:ev.paymentMethod.id
    });

    ev.complete("success");
    alert("Payment successful");
  });
}

/* =========================
   UI
========================= */
function switchView(v,el){
  event.preventDefault();

  document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".nav-link").forEach(x=>x.classList.remove("active"));

  if(v==="market")marketView.classList.add("active");
  if(v==="transactions")transactionsView.classList.add("active");

  el.classList.add("active");
}

function openDepositModal(){
  depositModal.style.display="flex";
}
function closeDepositModal(){
  depositModal.style.display="none";
}

/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded",()=>{
  renderTable();
  initChart();
  setupApplePay();
});

</script>

</body>
</html>
