<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Currency Exchange</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#d4d4d4;
  --text:#000;
}

*{box-sizing:border-box;}
body{
  margin:0;
  padding:40px;
  background:var(--bg);
  color:var(--text);
  font-family:"JetBrains Mono", monospace;
}

.container{max-width:1000px;margin:auto;}

h1{
  font-size:28px;
  letter-spacing:2px;
  border-bottom:1px solid black;
  padding-bottom:10px;
  margin-bottom:30px;
  text-align:center;
}

.nav-links{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-bottom:30px;
}

.nav-link{
  text-decoration:none;
  color:black;
  opacity:0.6;
  border-bottom:1px solid transparent;
}

.nav-link.active{
  opacity:1;
  font-weight:bold;
  border-bottom:1px solid black;
}

.panel{
  margin-top:30px;
  border:1px solid black;
  padding:25px;
  text-align:center;
}

#trendChart{max-height:260px;margin-top:20px;}

table{
  width:100%;
  margin-top:30px;
  border-collapse:collapse;
}

th,td{
  padding:14px;
  border-bottom:1px solid black;
  text-align:center;
  font-size:14px;
}

button{
  width:100%;
  margin-top:12px;
  padding:12px;
  background:black;
  color:white;
  border:1px solid black;
  cursor:pointer;
}

button:hover{
  background:white;
  color:black;
}

.view{display:none;}
.view.active{display:block;}

.pagination{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:15px;
  align-items:center;
}

.pagination button{
  width:auto;
  padding:8px 14px;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.65);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.modal-content{
  background:var(--bg);
  border:1px solid black;
  width:100%;
  max-width:420px;
  padding:25px;
  text-align:center;
}

.modal input,
.modal select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:1px solid black;
  background:black;
  color:white;
  text-align:center;
}

.secondary{
  background:white;
  color:black;
}

.secondary:hover{
  background:black;
  color:white;
}
</style>
</head>

<body>
<div class="container">

<div class="nav-links">
  <a href="#" class="nav-link active" onclick="switchView('market', this)">MARKET</a>
  <a href="#" class="nav-link" onclick="switchView('transactions', this)">TRANSACTIONS</a>
</div>

<!-- MARKET -->
<div id="marketView" class="view active">
<h1>CURRENCY EXCHANGE</h1>

<div class="panel">
<strong>GLOBAL DOLLAR</strong>
<p id="liveGlobal">$0</p>
<canvas id="trendChart"></canvas>
</div>

<div class="panel">
<strong>AI MARKET SYSTEM</strong>
<p class="blurb">
Currency Exchange monitors global markets in real time and executes trades automatically.
</p>
</div>

<table>
<thead>
<tr><th>ASSET</th><th>VALUE</th><th>CHANGE</th><th>NET %</th></tr>
</thead>
<tbody id="tradeTable"></tbody>
</table>

<div class="pagination">
<button onclick="prevPage()">Prev</button>
<span id="pageInfo"></span>
<button onclick="nextPage()">Next</button>
</div>

</div>

<!-- TRANSACTIONS -->
<div id="transactionsView" class="view">
<h1>TRANSACTIONS</h1>
<table>
<thead>
<tr><th>TYPE</th><th>AMOUNT</th><th>STATUS</th><th>TIME</th></tr>
</thead>
<tbody id="txTable"></tbody>
</table>
</div>

<!-- BANK -->
<div class="panel">
<strong>BANK</strong>
<button onclick="openDepositModal()">Deposit</button>
<button onclick="openWithdrawModal()">Send</button>
</div>

<!-- DEPOSIT MODAL -->
<div id="depositModal" class="modal">
  <div class="modal-content">
    <h2>DEPOSIT</h2>
    <select id="currencySelect">
      <option>USD</option><option>EUR</option><option>GBP</option>
      <option>JPY</option><option>AUD</option><option>CAD</option><option>CHF</option>
    </select>
    <input id="fundInput" type="number" placeholder="Amount"/>
    <button onclick="depositFunds()">Submit</button>
    <button class="secondary" onclick="closeDepositModal()">Cancel</button>
  </div>
</div>

<!-- WITHDRAW MODAL -->
<div id="withdrawModal" class="modal">
  <div class="modal-content">
    <h2>SEND</h2>

    <select id="sendMethod" onchange="updateSendFields()">
      <option value="bank">Bank</option>
      <option value="zelle">Zelle</option>
    </select>

    <div id="bankFields">
      <input id="routingNumber" placeholder="Routing"/>
      <input id="accountNumber" placeholder="Account"/>
    </div>

    <div id="zelleFields" style="display:none;">
      <input id="zelleEmail" placeholder="Zelle"/>
    </div>

    <input id="withdrawAmount" type="number" placeholder="Amount"/>

    <button onclick="sendToBank()">Submit</button>
    <button class="secondary" onclick="closeWithdrawModal()">Cancel</button>
  </div>
</div>

<script>
/* DATA */
const assets=[
"EURUSD","USDJPY","GBPUSD","USDCHF","AUDUSD","USDCAD","NZDUSD",
"EURGBP","EURJPY","EURCHF","EURAUD","EURCAD","EURNZD",
"GBPJPY","GBPCHF","GBPAUD","GBPCAD",
"AUDJPY","AUDNZD","AUDCAD",
"CADJPY","CHFJPY","NZDJPY",
"USDMXN","USDZAR","USDTRY","USDSEK","USDNOK",
"USDHKD","USDSGD"
];

const pageSize=10;
let currentPage=1;
let assetState={}, ledger=[], balance=0;
let chart, chartPoints=[];

/* INIT */
assets.forEach(a=>{
  assetState[a]={value:Math.random()*2,change:0,pct:0};
});

/* TABLE */
function renderTable(){
  const tbody=document.getElementById("tradeTable");
  tbody.innerHTML="";

  const start=(currentPage-1)*pageSize;
  const page=assets.slice(start,start+pageSize);

  page.forEach(a=>{
    const d=assetState[a];
    tbody.innerHTML+=`
      <tr>
        <td>${a}</td>
        <td>${d.value.toFixed(4)}</td>
        <td>${d.change}</td>
        <td>${d.pct}%</td>
      </tr>`;
  });

  document.getElementById("pageInfo").innerText=
    `Page ${currentPage} / ${Math.ceil(assets.length/pageSize)}`;
}

/* PAGINATION */
function nextPage(){if(currentPage<Math.ceil(assets.length/pageSize)){currentPage++;renderTable();}}
function prevPage(){if(currentPage>1){currentPage--;renderTable();}}

/* CHART */
function initChart(){
  const ctx=document.getElementById("trendChart");
  chart=new Chart(ctx,{
    type:"line",
    data:{labels:[],datasets:[{data:[],borderColor:"#000",fill:true,pointRadius:0}]},
    options:{animation:false,plugins:{legend:{display:false}},scales:{x:{display:false}}}
  });
}

/* LOOP */
setInterval(()=>{
  let sum=0;

  assets.forEach(a=>{
    const d=(Math.random()*2-1)/100;
    assetState[a].value+=d;
    assetState[a].change=d.toFixed(4);
    assetState[a].pct=(d*100).toFixed(2);
    sum+=assetState[a].value;
  });

  const global=(sum/assets.length)*100;
  document.getElementById("liveGlobal").innerText="$"+global.toFixed(2);

  chartPoints.push(global);
  if(chartPoints.length>30) chartPoints.shift();

  chart.data.labels=chartPoints.map((_,i)=>i);
  chart.data.datasets[0].data=chartPoints;
  chart.update();

  renderTable();

},1000);

/* BANK */
function depositFunds(){
  const amt=parseFloat(document.getElementById("fundInput").value||0);
  balance+=amt;
  addTx("DEPOSIT",amt,"SUCCESS");
  closeDepositModal();
}

function sendToBank(){
  const amt=parseFloat(document.getElementById("withdrawAmount").value||0);
  balance-=amt;
  addTx("SEND",amt,"PENDING");
  closeWithdrawModal();
}

function addTx(type,amount,status){
  ledger.unshift({type,amount,status,time:new Date().toLocaleString()});
  renderTx();
}

function renderTx(){
  const t=document.getElementById("txTable");
  if(!t) return;
  t.innerHTML="";
  ledger.forEach(x=>{
    t.innerHTML+=`<tr><td>${x.type}</td><td>$${x.amount}</td><td>${x.status}</td><td>${x.time}</td></tr>`;
  });
}

/* MODALS */
function openDepositModal(){depositModal.style.display="flex";}
function closeDepositModal(){depositModal.style.display="none";}
function openWithdrawModal(){withdrawModal.style.display="flex";}
function closeWithdrawModal(){withdrawModal.style.display="none";}

function updateSendFields(){
  const m=sendMethod.value;
  bankFields.style.display=m==="bank"?"block":"none";
  zelleFields.style.display=m==="zelle"?"block":"none";
}

/* NAV */
function switchView(v,el){
  event.preventDefault();
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".nav-link").forEach(x=>x.classList.remove("active"));
  document.getElementById(v+"View").classList.add("active");
  el.classList.add("active");
}

/* INIT */
document.addEventListener("DOMContentLoaded",()=>{
  initChart();
  renderTable();
});
</script>
</body>
</html>
