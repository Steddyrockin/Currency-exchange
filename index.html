<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Currency Exchange</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#d4d4d4;
  --ink:#000;
  --muted:rgba(0,0,0,0.6);
}

*{box-sizing:border-box;}

body{
  margin:0;
  padding:40px;
  background:var(--bg);
  color:var(--ink);
  font-family:"JetBrains Mono", monospace;
}

.container{
  max-width:1050px;
  margin:auto;
}

h1{
  font-size:28px;
  letter-spacing:2px;
  text-align:center;
  border-bottom:1px solid var(--ink);
  padding-bottom:12px;
  margin-bottom:30px;
}

.nav-links{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-bottom:30px;
  font-size:13px;
}

.nav-link{
  color:var(--ink);
  text-decoration:none;
  opacity:0.5;
  border-bottom:1px solid transparent;
  padding-bottom:3px;
}

.nav-link:hover{opacity:1;border-bottom:1px solid var(--ink);}
.nav-link.active{opacity:1;font-weight:bold;border-bottom:1px solid var(--ink);}

.panel{
  border:1px solid var(--ink);
  padding:22px;
  margin-top:24px;
  text-align:center;
  background:rgba(255,255,255,0.15);
}

.panel strong{
  display:block;
  margin-bottom:10px;
  letter-spacing:1px;
}

#trendChart{
  width:100%!important;
  max-height:260px;
  margin-top:18px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:28px;
}

th,td{
  padding:14px;
  border-bottom:1px solid var(--ink);
  font-size:13px;
  text-align:center;
}

th{opacity:0.7;}

button{
  width:100%;
  margin-top:12px;
  padding:12px;
  background:var(--ink);
  color:white;
  border:1px solid var(--ink);
  cursor:pointer;
  font-family:inherit;
}

button:hover{
  background:white;
  color:var(--ink);
}

.secondary{
  background:white;
  color:var(--ink);
}

.secondary:hover{
  background:var(--ink);
  color:white;
}

.view{display:none;}
.view.active{display:block;}

.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
}

.modal-content{
  background:var(--bg);
  border:1px solid var(--ink);
  padding:28px;
  width:360px;
  text-align:center;
}
</style>
</head>

<body>

<div class="container">

<div class="nav-links">
  <a href="#" class="nav-link active" onclick="switchView(event,'market',this)">MARKET</a>
  <a href="#" class="nav-link" onclick="switchView(event,'transactions',this)">TRANSACTIONS</a>
</div>

<!-- MARKET -->
<div id="marketView" class="view active">

<h1>CURRENCY EXCHANGE</h1>

<div class="panel">
  <strong>GLOBAL INDEX</strong>
  <div id="liveGlobal">$0.00</div>
  <canvas id="trendChart"></canvas>
</div>

<div class="panel">
  <strong>AI MARKET ENGINE</strong>
  <div style="font-size:13px;opacity:0.7;line-height:1.6;">
    Autonomous pricing system simulating global FX liquidity streams.
  </div>
</div>

<table>
<thead>
<tr>
  <th>ASSET</th>
  <th>VALUE</th>
  <th>MOMENTUM</th>
  <th>VOL</th>
</tr>
</thead>
<tbody id="tradeTable"></tbody>
</table>

<div class="panel"><strong>BALANCE</strong><div id="allocatedAmount">$0</div></div>
<div class="panel"><strong>TOTAL P&L</strong><div id="totalEarned">$0</div></div>

</div>

<!-- TRANSACTIONS -->
<div id="transactionsView" class="view">
<h1>TRANSACTIONS</h1>

<table>
<thead>
<tr><th>TYPE</th><th>AMOUNT</th><th>STATUS</th><th>TIME</th></tr>
</thead>
<tbody id="txTable"></tbody>
</table>
</div>

<!-- BANK -->
<div class="panel">
<strong>BANK</strong>

<button onclick="openDepositModal()">Deposit</button>
<button onclick="openWithdrawModal()">Send</button>
<button onclick="fakeApplePay()">Pay with Apple Pay</button>
</div>

<!-- MODALS -->
<div id="depositModal" class="modal">
  <div class="modal-content">
    <strong>DEPOSIT</strong>
    <input type="number" placeholder="Amount"/>
    <button>Confirm</button>
    <button class="secondary" onclick="closeDepositModal()">Cancel</button>
  </div>
</div>

<div id="withdrawModal" class="modal">
  <div class="modal-content">
    <strong>SEND</strong>
    <input placeholder="Recipient"/>
    <input type="number" placeholder="Amount"/>
    <button>Transfer</button>
    <button class="secondary" onclick="closeWithdrawModal()">Cancel</button>
  </div>
</div>

</div>

<script>

const assets=["EURUSD","USDJPY","GBPUSD"];

let chart;
let points=[];

/* INIT TABLE */
const table=document.getElementById("tradeTable");

assets.forEach(a=>{
  const row=document.createElement("tr");
  row.innerHTML=`
    <td>${a}</td>
    <td id="${a}">--</td>
    <td id="m${a}">0</td>
    <td id="v${a}">0</td>
  `;
  table.appendChild(row);
});

/* CHART */
function initChart(){
  const ctx=document.getElementById("trendChart");

  chart=new Chart(ctx,{
    type:"line",
    data:{
      labels:[],
      datasets:[{
        data:[],
        borderColor:"#000",
        backgroundColor:"rgba(0,0,0,0.08)",
        borderWidth:1,
        pointRadius:0,
        tension:0.25,
        fill:true
      }]
    },
    options:{
      animation:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{display:false},
        y:{
          grid:{color:"rgba(0,0,0,0.08)"},
          ticks:{color:"#000",font:{family:"JetBrains Mono",size:10}}
        }
      }
    }
  });
}

/* MARKET SIM (realistic drift model) */
let base=100;

function tickMarket(){
  let sum=0;

  assets.forEach(a=>{
    const drift=(Math.random()-0.5)*0.4;
    const value=base+drift;

    document.getElementById(a).innerText=value.toFixed(4);

    document.getElementById("m"+a).innerText=(drift>0?"+":"") + drift.toFixed(3);
    document.getElementById("v"+a).innerText=(Math.random()*2).toFixed(2);

    sum+=value;
  });

  const global=sum/assets.length;

  document.getElementById("liveGlobal").innerText="$"+global.toFixed(2);

  points.push(global);
  if(points.length>40) points.shift();

  chart.data.labels=points.map((_,i)=>i);
  chart.data.datasets[0].data=points;
  chart.update();
}

/* NAV */
function switchView(e,view,el){
  e.preventDefault();

  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.querySelectorAll(".nav-link").forEach(l=>l.classList.remove("active"));

  document.getElementById(view+"View").classList.add("active");
  el.classList.add("active");
}

/* MODALS */
function openDepositModal(){document.getElementById("depositModal").style.display="flex";}
function closeDepositModal(){document.getElementById("depositModal").style.display="none";}
function openWithdrawModal(){document.getElementById("withdrawModal").style.display="flex";}
function closeWithdrawModal(){document.getElementById("withdrawModal").style.display="none";}

/* STRIPE (HOOK READY) */
const stripe = Stripe("pk_test_YOUR_KEY");

/* APPLE PAY STUB */
function fakeApplePay(){
  alert("Apple Pay session initialized (demo mode)");
}

/* START */
document.addEventListener("DOMContentLoaded",()=>{
  initChart();
  setInterval(tickMarket,900);
});

</script>

</body>
</html>
