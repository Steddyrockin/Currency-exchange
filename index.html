<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Currency Exchange</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#d4d4d4;
  --text:#000;
}
*{box-sizing:border-box;}
body{margin:0;padding:40px;background:var(--bg);color:var(--text);font-family:"JetBrains Mono",monospace;}
.container{max-width:1000px;margin:auto;}
h1{font-size:28px;letter-spacing:2px;border-bottom:1px solid black;padding-bottom:10px;margin-bottom:30px;text-align:center;}

.nav-links{display:flex;justify-content:center;gap:20px;margin-bottom:30px;flex-wrap:wrap;font-size:14px;}
.nav-link{text-decoration:none;color:black;padding-bottom:4px;border-bottom:1px solid transparent;opacity:0.6;}
.nav-link:hover{border-bottom:1px solid black;opacity:1;}
.nav-link.active{border-bottom:1px solid black;font-weight:bold;opacity:1;}

.panel{margin-top:30px;border:1px solid black;padding:25px;text-align:center;}
.blurb{font-size:14px;line-height:1.6;max-width:700px;margin:auto;}

input, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:1px solid black;
  text-align:center;
  font-family:"JetBrains Mono", monospace;
  font-size:14px;
  background:black;
  color:white;
}

button{
  width:100%;
  margin-top:12px;
  padding:12px;
  background:black;
  color:white;
  border:1px solid black;
  cursor:pointer;
}
button:hover{background:white;color:black;}

table{width:100%;margin-top:30px;border-collapse:collapse;}
th,td{padding:14px;border-bottom:1px solid black;text-align:center;font-size:14px;}

.view{display:none;}
.view.active{display:block;}

.footer{margin-top:50px;padding-top:20px;border-top:1px solid black;display:flex;justify-content:center;gap:10px;font-size:12px;}
.footer a{color:black;text-decoration:none;}

canvas{
  margin-top:25px;
  background:white;
  border:1px solid black;
  padding:10px;
}
</style>
</head>

<body>
<div class="container">

<div class="nav-links">
  <a href="#" class="nav-link active" onclick="switchView('market', this)">MARKET</a>
  <a href="#" class="nav-link" onclick="switchView('transactions', this)">TRANSACTIONS</a>
</div>

<div id="marketView" class="view active">
<h1>CURRENCY EXCHANGE</h1>

<div class="panel">
<strong>GLOBAL DOLLAR</strong>
<p id="liveGlobal">$0</p>
</div>

<!-- 🔥 REAL TIME CHART -->
<div class="panel">
<strong>EURUSD LIVE TREND</strong>
<canvas id="trendChart" height="120"></canvas>
</div>

<table>
<thead>
<tr><th>ASSET</th><th>VALUE</th><th>CHANGE</th><th>NET %</th></tr>
</thead>
<tbody id="tradeTable"></tbody>
</table>

</div>

<div id="transactionsView" class="view">
<h1>TRANSACTIONS</h1>
<table>
<thead>
<tr><th>TYPE</th><th>AMOUNT</th><th>STATUS</th><th>TIME</th></tr>
</thead>
<tbody id="txTable"></tbody>
</table>
</div>

<div class="footer">
<span>© <span id="year"></span> Clean, Inc.</span>
</div>

</div>

<script>
const API="http://localhost:4000/api";
document.getElementById("year").innerText=new Date().getFullYear();

let assets=["EURUSD","USDJPY","GBPUSD"];

/* TABLE */
assets.forEach(a=>{
  const row=document.createElement("tr");
  row.innerHTML=`<td>${a}</td><td id="${a}">--</td><td>-</td><td>-</td>`;
  tradeTable.appendChild(row);
});

/* 🔥 CHART SETUP */
const ctx = document.getElementById("trendChart").getContext("2d");

let priceData = [];
let labels = [];

const chart = new Chart(ctx,{
  type:"line",
  data:{
    labels:labels,
    datasets:[{
      label:"EURUSD",
      data:priceData,
      borderColor:"black",
      tension:0.3,
      fill:false
    }]
  },
  options:{
    responsive:true,
    animation:false,
    scales:{
      x:{display:false}
    }
  }
});

/* LIVE UPDATE LOOP */
setInterval(()=>{
  assets.forEach(a=>{
    const val=Math.random()*2;

    document.getElementById(a).innerText=val.toFixed(4);

    if(a==="EURUSD"){
      priceData.push(val);
      labels.push("");

      if(priceData.length>30){
        priceData.shift();
        labels.shift();
      }

      chart.update();
    }
  });
},1000);

/* VIEW SWITCH */
function switchView(view,el){
  event.preventDefault();
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.querySelectorAll(".nav-link").forEach(l=>l.classList.remove("active"));

  if(view==="market")marketView.classList.add("active");
  if(view==="transactions")transactionsView.classList.add("active");

  el.classList.add("active");
}
</script>
</body>
</html>
