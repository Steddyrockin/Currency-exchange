<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Currency Exchange</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#d4d4d4;
  --text:#000;
}
*{box-sizing:border-box;}
body{
  margin:0;
  padding:40px;
  background:var(--bg);
  color:var(--text);
  font-family:"JetBrains Mono",monospace;
}
.container{max-width:1000px;margin:auto;}

h1{
  font-size:28px;
  letter-spacing:2px;
  border-bottom:1px solid black;
  padding-bottom:10px;
  margin-bottom:30px;
  text-align:center;
}

.nav-links{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-bottom:30px;
  flex-wrap:wrap;
  font-size:14px;
}

.nav-link{
  text-decoration:none;
  color:black;
  padding-bottom:4px;
  border-bottom:1px solid transparent;
  opacity:0.6;
}
.nav-link:hover{border-bottom:1px solid black;opacity:1;}
.nav-link.active{border-bottom:1px solid black;font-weight:bold;opacity:1;}

.panel{
  margin-top:30px;
  border:1px solid black;
  padding:25px;
  text-align:center;
}

#valueChart{
  width:100%!important;
  height:260px !important;
}

.blurb{
  font-size:14px;
  line-height:1.6;
  max-width:700px;
  margin:auto;
}

table{
  width:100%;
  margin-top:30px;
  border-collapse:collapse;
}
th,td{
  padding:14px;
  border-bottom:1px solid black;
  text-align:center;
  font-size:14px;
}

.view{display:none;}
.view.active{display:block;}

.footer{
  margin-top:50px;
  padding-top:20px;
  border-top:1px solid black;
  text-align:center;
  font-size:12px;
}
</style>
</head>

<body>
<div class="container">

<div class="nav-links">
  <a href="#" class="nav-link active" onclick="switchView('market', this)">MARKET</a>
  <a href="#" class="nav-link" onclick="switchView('transactions', this)">TRANSACTIONS</a>
</div>

<!-- MARKET -->
<div id="marketView" class="view active">
<h1>CURRENCY EXCHANGE</h1>

<div class="panel">
<strong>GLOBAL DOLLAR</strong>
<p id="liveGlobal">$100.00</p>
</div>

<div class="panel">
<strong>ASSET TREND</strong>
<canvas id="valueChart"></canvas>
</div>

<div class="panel">
<strong>AI MARKET SYSTEM</strong>
<p class="blurb">
Real-time adaptive trading system analyzing global markets and dynamically allocating capital.
</p>
</div>

<table>
<thead>
<tr><th>ASSET</th><th>VALUE</th><th>CHANGE</th><th>NET %</th></tr>
</thead>
<tbody id="tradeTable"></tbody>
</table>

<div class="panel"><strong>BALANCE</strong><p id="allocatedAmount">$0</p></div>
<div class="panel"><strong>TOTAL EARNED</strong><p id="totalEarned">$0</p></div>
</div>

<!-- TRANSACTIONS -->
<div id="transactionsView" class="view">
<h1>TRANSACTIONS</h1>
<table>
<thead>
<tr><th>TYPE</th><th>AMOUNT</th><th>STATUS</th><th>TIME</th></tr>
</thead>
<tbody id="txTable"></tbody>
</table>
</div>

<div class="footer">
© <span id="year"></span> Clean, Inc.
</div>

</div>

<script>
document.getElementById("year").innerText=new Date().getFullYear();

const assets=["EURUSD","USDJPY","GBPUSD"];

/* TABLE */
assets.forEach(a=>{
  const row=document.createElement("tr");
  row.innerHTML=`<td>${a}</td><td id="${a}">--</td><td>-</td><td>-</td>`;
  tradeTable.appendChild(row);
});

/* INIT VALUES */
const assetValues = {
  EURUSD: 1.0,
  USDJPY: 1.0,
  GBPUSD: 1.0
};

/* CHART */
const ctx=document.getElementById("valueChart").getContext("2d");

const valueChart = new Chart(ctx, {
  type: "bar",
  data: {
    labels: assets,
    datasets: [{
      label: "Asset Value",
      data: assets.map(a => assetValues[a]),
      backgroundColor: "#000",
      borderColor: "#000",
      borderWidth: 1
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    indexAxis: 'y', // 👈 Y-axis becomes assets
    animation: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: "#000",
        titleColor: "#fff",
        bodyColor: "#fff",
        callbacks: {
          label: (ctx) => "$" + ctx.raw.toFixed(4)
        }
      }
    },
    scales: {
      x: {
        ticks: {
          color: "#000",
          callback: v => "$" + v
        },
        grid: { color: "rgba(0,0,0,0.08)" }
      },
      y: {
        ticks: { color: "#000" },
        grid: { display: false }
      }
    }
  }
});

/* LIVE UPDATE */
let globalValue=100;

setInterval(()=>{

  assets.forEach(a=>{
    const change = (Math.random()-0.5)*0.05;
    assetValues[a] = Math.max(0, assetValues[a] + change);

    document.getElementById(a).innerText = assetValues[a].toFixed(4);
  });

  liveGlobal.innerText = "$" + (globalValue += (Math.random()-0.5)*2).toFixed(2);

  valueChart.data.datasets[0].data = assets.map(a => assetValues[a]);
  valueChart.update();

},1000);

/* VIEW SWITCH */
function switchView(view,el){
  event.preventDefault();
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.querySelectorAll(".nav-link").forEach(l=>l.classList.remove("active"));

  if(view==="market")marketView.classList.add("active");
  if(view==="transactions")transactionsView.classList.add("active");

  el.classList.add("active");
}
</script>

</body>
</html>
