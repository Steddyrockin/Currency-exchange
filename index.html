<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Currency Exchange</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#d4d4d4;
  --text:#000;
}
*{box-sizing:border-box;}
body{
  margin:0;
  padding:40px;
  background:var(--bg);
  color:var(--text);
  font-family:"JetBrains Mono",monospace;
}
.container{max-width:1000px;margin:auto;}

h1{
  font-size:28px;
  letter-spacing:2px;
  border-bottom:1px solid black;
  padding-bottom:10px;
  margin-bottom:30px;
  text-align:center;
}

.nav-links{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-bottom:30px;
  flex-wrap:wrap;
  font-size:14px;
}

.nav-link{
  text-decoration:none;
  color:black;
  padding-bottom:4px;
  border-bottom:1px solid transparent;
  opacity:0.6;
}
.nav-link:hover{border-bottom:1px solid black;opacity:1;}
.nav-link.active{border-bottom:1px solid black;font-weight:bold;opacity:1;}

.panel{
  margin-top:30px;
  border:1px solid black;
  padding:25px;
  text-align:center;
}

.panel strong{display:block;margin-bottom:12px;}

canvas{
  width:100%!important;
}

/* ✅ BIGGER GRAPH */
#valueChart{
  height:260px !important;
}

.blurb{
  font-size:14px;
  line-height:1.6;
  max-width:700px;
  margin:auto;
}

input, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:1px solid black;
  text-align:center;
  font-family:"JetBrains Mono", monospace;
  font-size:14px;
  background:black;
  color:white;
}

button{
  width:100%;
  margin-top:12px;
  padding:12px;
  background:black;
  color:white;
  border:1px solid black;
  cursor:pointer;
}
button:hover{background:white;color:black;}

.secondary{background:white;color:black;}
.secondary:hover{background:black;color:white;}

.apple-pay-btn{margin-top:10px;padding:14px;}

table{
  width:100%;
  margin-top:30px;
  border-collapse:collapse;
}
th,td{
  padding:14px;
  border-bottom:1px solid black;
  text-align:center;
  font-size:14px;
}

.view{display:none;}
.view.active{display:block;}

.footer{
  margin-top:50px;
  padding-top:20px;
  border-top:1px solid black;
  text-align:center;
  font-size:12px;
}

.modal{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#d4d4d4;
  padding:30px;
  border:1px solid black;
  max-width:400px;
  width:100%;
  text-align:center;
}
</style>
</head>

<body>
<div class="container">

<div class="nav-links">
  <a href="#" class="nav-link active" onclick="switchView('market', this)">MARKET</a>
  <a href="#" class="nav-link" onclick="switchView('transactions', this)">TRANSACTIONS</a>
</div>

<!-- MARKET -->
<div id="marketView" class="view active">
<h1>CURRENCY EXCHANGE</h1>

<div class="panel">
<strong>GLOBAL DOLLAR</strong>
<p id="liveGlobal">$100.00</p>
</div>

<div class="panel">
<strong>VALUE TREND</strong>
<canvas id="valueChart"></canvas>
</div>

<div class="panel">
<strong>AI MARKET SYSTEM</strong>
<p class="blurb">
Real-time adaptive trading system analyzing global markets and dynamically allocating capital.
</p>
</div>

<table>
<thead>
<tr><th>ASSET</th><th>VALUE</th><th>CHANGE</th><th>NET %</th></tr>
</thead>
<tbody id="tradeTable"></tbody>
</table>

<div class="panel"><strong>BALANCE</strong><p id="allocatedAmount">$0</p></div>
<div class="panel"><strong>TOTAL EARNED</strong><p id="totalEarned">$0</p></div>
</div>

<!-- TRANSACTIONS -->
<div id="transactionsView" class="view">
<h1>TRANSACTIONS</h1>
<table>
<thead>
<tr><th>TYPE</th><th>AMOUNT</th><th>STATUS</th><th>TIME</th></tr>
</thead>
<tbody id="txTable"></tbody>
</table>
</div>

<!-- BANK -->
<div class="panel">
<strong>BANK</strong>
<button onclick="openDepositModal()">Deposit</button>
<button onclick="openWithdrawModal()">Send</button>
<button id="applePayBtn" class="apple-pay-btn">Pay with  Apple Pay</button>
</div>

<!-- FOOTER -->
<div class="footer">
© <span id="year"></span> Clean, Inc.
</div>

</div>

<script>
const stripe = Stripe("pk_test_YOUR_PUBLIC_KEY");
const assets=["EURUSD","USDJPY","GBPUSD"];
document.getElementById("year").innerText=new Date().getFullYear();

/* TABLE INIT */
assets.forEach(a=>{
  const row=document.createElement("tr");
  row.innerHTML=`<td>${a}</td><td id="${a}">--</td><td>-</td><td>-</td>`;
  tradeTable.appendChild(row);
});

/* CHART */
const ctx=document.getElementById("valueChart").getContext("2d");
let chartData=[];
let chartLabels=[];

const valueChart=new Chart(ctx,{
  type:"line",
  data:{
    labels:chartLabels,
    datasets:[{
      data:chartData,
      borderColor:"#000",
      backgroundColor:"transparent",
      tension:0.2,
      borderWidth:2,
      pointRadius:0
    }]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false, // ✅ allows taller chart
    animation:false,
    plugins:{legend:{display:false}},
    scales:{
      x:{
        display:true,
        title:{display:true,text:"Time"},
        ticks:{maxTicksLimit:6}
      },
      y:{
        display:true,
        title:{display:true,text:"Value ($)"},
        ticks:{callback:(v)=>"$"+v}
      }
    }
  }
});

/* LIVE DATA */
let globalValue=100;

setInterval(()=>{
  assets.forEach(a=>{
    const val=Math.random()*2;
    document.getElementById(a).innerText=val.toFixed(4);
  });

  globalValue+=(Math.random()-0.5)*2;
  if(globalValue<0)globalValue=0;

  liveGlobal.innerText="$"+globalValue.toFixed(2);

  const time=new Date().toLocaleTimeString();

  chartLabels.push(time);
  chartData.push(globalValue.toFixed(2));

  if(chartData.length>30){
    chartData.shift();
    chartLabels.shift();
  }

  valueChart.update();

},1000);

/* VIEW SWITCH */
function switchView(view,el){
  event.preventDefault();
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.querySelectorAll(".nav-link").forEach(l=>l.classList.remove("active"));
  if(view==="market")marketView.classList.add("active");
  if(view==="transactions")transactionsView.classList.add("active");
  el.classList.add("active");
}
</script>

</body>
</html>
